[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "standardsforge"
version = "0.1.0a4"
description = "Offline-first standards pack compiler and evidence engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
keywords = ["standards", "evidence", "retrieval", "offline"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.urls]
Homepage = "https://github.com/DDNA-Engineering/standards-memory"
Documentation = "https://github.com/DDNA-Engineering/standards-memory/wiki"
Issues = "https://github.com/DDNA-Engineering/standards-memory/issues"
Source = "https://github.com/DDNA-Engineering/standards-memory"

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
compiler = ["fonttools==4.65.0", "pypdf==6.19.0"]
contract = ["jsonschema==4.26.0"]

[project.scripts]
standardsforge = "standardsforge.cli:main"
standardsforge-mcp = "standardsforge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
